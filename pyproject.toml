[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fwh-airisk"
version = "0.1.0"
description = "Facetwork domain: how AI could harm humanity, and the measured indicators behind each pathway (compute, capabilities, autonomy, cyber, labour, investment, reported incidents, expert surveys), refreshed into a self-updating paper and dashboard"
requires-python = ">=3.11"
authors = [{name = "Ralph Lemke"}]
dependencies = ["jinja2>=3.0"]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.entry-points."facetwork.domains"]
airisk = "airisk:domain"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
airisk = ["ffl/*.ffl", "site/templates/*.html", "data/*.json"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501", "B008", "B905"]
